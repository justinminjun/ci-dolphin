<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin Admin — Banner Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0F172A; color: #E2E8F0; min-height: 100vh; }

        .navbar { background: #1E293B; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
        .navbar h1 { font-size: 20px; font-weight: 800; color: #63BCFF; display: flex; align-items: center; gap: 8px; }
        .navbar h1 span { font-size: 24px; }
        .status { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .status.online { background: #065F46; color: #6EE7B7; }
        .status.offline { background: #7F1D1D; color: #FCA5A5; }

        .container { max-width: 900px; margin: 0 auto; padding: 32px 24px; }

        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
        .section-title .count { font-size: 13px; color: #94A3B8; font-weight: 500; }

        /* Add Banner Form */
        .add-form { background: #1E293B; border: 1px solid #334155; border-radius: 16px; padding: 24px; margin-bottom: 32px; }
        .add-form h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #F8FAFC; }
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .form-row.full { flex-direction: column; }
        .form-group { flex: 1; }
        .form-group label { font-size: 12px; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
        .form-group input, .form-group textarea { width: 100%; background: #0F172A; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; color: #E2E8F0; font-size: 14px; font-family: inherit; outline: none; transition: border 0.2s; }
        .form-group input:focus, .form-group textarea:focus { border-color: #63BCFF; }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .image-upload { border: 2px dashed #334155; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
        .image-upload:hover { border-color: #63BCFF; background: #1E293B; }
        .image-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .image-upload .label { font-size: 13px; color: #64748B; }
        .image-upload .label strong { color: #63BCFF; }
        .image-preview { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; margin: 0 auto 8px; display: block; }

        .btn { padding: 10px 20px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; }
        .btn-primary { background: #63BCFF; color: #0F172A; }
        .btn-primary:hover { background: #38A3F1; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: #7F1D1D; color: #FCA5A5; }
        .btn-danger:hover { background: #991B1B; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

        .actions-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

        /* Banner List */
        .banner-list { display: flex; flex-direction: column; gap: 12px; }
        .banner-item { background: #1E293B; border: 1px solid #334155; border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; transition: all 0.2s; }
        .banner-item:hover { border-color: #475569; }
        .banner-order { font-size: 24px; font-weight: 800; color: #334155; min-width: 32px; text-align: center; }
        .banner-thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: #0F172A; flex-shrink: 0; }
        .banner-thumb-placeholder { width: 64px; height: 64px; border-radius: 10px; background: #0F172A; display: flex; align-items: center; justify-content: center; color: #475569; font-size: 20px; flex-shrink: 0; }
        .banner-info { flex: 1; min-width: 0; }
        .banner-info .title { font-size: 15px; font-weight: 700; color: #F8FAFC; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .banner-info .subtitle { font-size: 13px; color: #94A3B8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .banner-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-icon { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #334155; background: transparent; color: #94A3B8; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.15s; }
        .btn-icon:hover { border-color: #63BCFF; color: #63BCFF; }
        .btn-icon.danger:hover { border-color: #EF4444; color: #EF4444; }

        /* Phone Preview */
        .preview-section { margin-top: 40px; }
        .phone-frame { width: 280px; margin: 0 auto; background: #F8FAFC; border-radius: 20px; padding: 16px; border: 2px solid #334155; }
        .phone-header { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
        .phone-header img { width: 20px; height: 20px; border-radius: 4px; }
        .phone-header span { font-size: 16px; font-weight: 800; color: #0C2340; }
        .preview-banner { width: 100%; height: 56px; border-radius: 10px; background: #F1F5F9; border: 1px solid #E2E8F0; display: flex; align-items: center; padding: 0 12px; gap: 10px; margin-bottom: 6px; overflow: hidden; }
        .preview-banner .text { flex: 1; min-width: 0; }
        .preview-banner .text .t { font-size: 11px; font-weight: 700; color: #0C2340; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .preview-banner .text .s { font-size: 9px; color: #64748B; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .preview-banner img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .preview-dots { display: flex; justify-content: center; gap: 4px; margin-top: 6px; }
        .preview-dots .d { width: 5px; height: 5px; border-radius: 3px; background: #CBD5E1; }
        .preview-dots .d.active { width: 12px; background: #63BCFF; }

        .empty-state { text-align: center; padding: 40px; color: #475569; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #065F46; color: #6EE7B7; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
        .toast.show { opacity: 1; }

        .upload-progress { height: 3px; background: #1E293B; border-radius: 2px; margin-top: 8px; overflow: hidden; display: none; }
        .upload-progress .bar { height: 100%; background: #63BCFF; border-radius: 2px; transition: width 0.3s; }

        @media (max-width: 600px) {
            .form-row { flex-direction: column; }
            .container { padding: 16px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1><span>🐬</span> Dolphin Admin</h1>
        <span id="connStatus" class="status offline">Connecting...</span>
    </nav>

    <div class="container">
        <!-- Add Banner Form -->
        <div class="add-form">
            <h2>➕ Add New Banner</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="inputTitle" placeholder="Banner title..." />
                </div>
                <div class="form-group">
                    <label>Subtitle</label>
                    <input type="text" id="inputSubtitle" placeholder="Short description..." />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Image (72×72 thumbnail)</label>
                    <div class="image-upload" id="imageUploadArea">
                        <div id="imagePreviewWrap"></div>
                        <div class="label" id="uploadLabel">Click or drag to upload<br><strong>PNG, JPG — recommended 144×144px</strong></div>
                        <input type="file" id="inputImage" accept="image/*" />
                    </div>
                    <div class="upload-progress" id="uploadProgress"><div class="bar" id="uploadBar"></div></div>
                </div>
            </div>
            <div class="actions-row">
                <button class="btn btn-primary" id="btnAdd" disabled>Add Banner</button>
            </div>
        </div>

        <!-- Banner List -->
        <div class="section-title">
            Active Banners <span class="count" id="bannerCount">0 banners</span>
        </div>
        <div class="banner-list" id="bannerList">
            <div class="empty-state">
                <div class="icon">📭</div>
                <div>No banners yet. Add one above!</div>
            </div>
        </div>

        <!-- Preview -->
        <div class="preview-section">
            <div class="section-title">📱 Live Preview</div>
            <div class="phone-frame">
                <div class="phone-header">
                    <span>🐬 Dolphin</span>
                </div>
                <div id="previewBanners"></div>
                <div class="preview-dots" id="previewDots"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js';
        import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, deleteDoc, doc, updateDoc, getDocs } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js';
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-storage.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDVg9Bxu9WWM4xe-yNVHCNxL-RaxGOJWog",
            authDomain: "lost-and-found-20c10.firebaseapp.com",
            projectId: "lost-and-found-20c10",
            storageBucket: "lost-and-found-20c10.firebasestorage.app",
            messagingSenderId: "596104147964",
            appId: "1:596104147964:web:a5354700b1f5117ee9f879",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // State
        let banners = [];
        let uploadedImageUrl = null;
        let selectedFile = null;

        // DOM
        const $ = id => document.getElementById(id);
        const inputTitle = $('inputTitle');
        const inputSubtitle = $('inputSubtitle');
        const inputImage = $('inputImage');
        const btnAdd = $('btnAdd');
        const bannerList = $('bannerList');
        const bannerCount = $('bannerCount');
        const connStatus = $('connStatus');
        const toast = $('toast');
        const uploadLabel = $('uploadLabel');
        const imagePreviewWrap = $('imagePreviewWrap');
        const uploadProgress = $('uploadProgress');
        const uploadBar = $('uploadBar');

        // Toast
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Validate add button
        function checkAddBtn() {
            btnAdd.disabled = !inputTitle.value.trim();
        }
        inputTitle.addEventListener('input', checkAddBtn);

        // Image preview
        inputImage.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (ev) => {
                imagePreviewWrap.innerHTML = `<img class="image-preview" src="${ev.target.result}" />`;
                uploadLabel.innerHTML = `<strong>${file.name}</strong> — Click to change`;
            };
            reader.readAsDataURL(file);
        });

        // Upload image to Firebase Storage
        async function uploadImage(file) {
            const fileName = `banners/${Date.now()}_${file.name}`;
            const storageRef = ref(storage, fileName);
            const task = uploadBytesResumable(storageRef, file);

            uploadProgress.style.display = 'block';

            return new Promise((resolve, reject) => {
                task.on('state_changed',
                    (snap) => {
                        const pct = (snap.bytesTransferred / snap.totalBytes) * 100;
                        uploadBar.style.width = pct + '%';
                    },
                    (err) => { uploadProgress.style.display = 'none'; reject(err); },
                    async () => {
                        const url = await getDownloadURL(task.snapshot.ref);
                        uploadProgress.style.display = 'none';
                        resolve(url);
                    }
                );
            });
        }

        // Add banner
        btnAdd.addEventListener('click', async () => {
            const title = inputTitle.value.trim();
            const subtitle = inputSubtitle.value.trim();
            if (!title) return;

            btnAdd.disabled = true;
            btnAdd.textContent = 'Adding...';

            try {
                let imageUrl = null;
                if (selectedFile) {
                    imageUrl = await uploadImage(selectedFile);
                }

                const order = banners.length + 1;
                await addDoc(collection(db, 'app_banners'), {
                    title,
                    subtitle,
                    imageUrl: imageUrl || null,
                    order,
                    createdAt: new Date(),
                });

                // Reset form
                inputTitle.value = '';
                inputSubtitle.value = '';
                selectedFile = null;
                imagePreviewWrap.innerHTML = '';
                uploadLabel.innerHTML = 'Click or drag to upload<br><strong>PNG, JPG — recommended 144×144px</strong>';
                inputImage.value = '';
                showToast('✅ Banner added! App will update in real-time.');
            } catch (err) {
                alert('Error: ' + err.message);
            }

            btnAdd.textContent = 'Add Banner';
            checkAddBtn();
        });

        // Delete banner
        window.deleteBanner = async (id) => {
            if (!confirm('Delete this banner?')) return;
            try {
                await deleteDoc(doc(db, 'app_banners', id));
                showToast('🗑️ Banner deleted');
            } catch (err) { alert('Error: ' + err.message); }
        };

        // Move banner up/down
        window.moveBanner = async (id, direction) => {
            const idx = banners.findIndex(b => b.id === id);
            const swapIdx = idx + direction;
            if (swapIdx < 0 || swapIdx >= banners.length) return;

            try {
                await updateDoc(doc(db, 'app_banners', banners[idx].id), { order: swapIdx + 1 });
                await updateDoc(doc(db, 'app_banners', banners[swapIdx].id), { order: idx + 1 });
                showToast('↕️ Order updated');
            } catch (err) { alert('Error: ' + err.message); }
        };

        // Render banner list
        function renderBanners() {
            bannerCount.textContent = `${banners.length} banner${banners.length !== 1 ? 's' : ''}`;

            if (banners.length === 0) {
                bannerList.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div>No banners yet. Add one above!</div></div>`;
            } else {
                bannerList.innerHTML = banners.map((b, i) => `
                    <div class="banner-item">
                        <div class="banner-order">${i + 1}</div>
                        ${b.imageUrl
                            ? `<img class="banner-thumb" src="${b.imageUrl}" />`
                            : `<div class="banner-thumb-placeholder">🖼️</div>`
                        }
                        <div class="banner-info">
                            <div class="title">${b.title || 'Untitled'}</div>
                            <div class="subtitle">${b.subtitle || '—'}</div>
                        </div>
                        <div class="banner-actions">
                            <button class="btn-icon" onclick="moveBanner('${b.id}', -1)" title="Move up">↑</button>
                            <button class="btn-icon" onclick="moveBanner('${b.id}', 1)" title="Move down">↓</button>
                            <button class="btn-icon danger" onclick="deleteBanner('${b.id}')" title="Delete">✕</button>
                        </div>
                    </div>
                `).join('');
            }

            // Preview
            const previewEl = $('previewBanners');
            const dotsEl = $('previewDots');
            if (banners.length === 0) {
                previewEl.innerHTML = `<div class="preview-banner"><div class="text"><div class="t">No banners</div><div class="s">Add one from above</div></div></div>`;
                dotsEl.innerHTML = '';
            } else {
                previewEl.innerHTML = banners.map(b => `
                    <div class="preview-banner">
                        <div class="text">
                            <div class="t">${b.title || ''}</div>
                            <div class="s">${b.subtitle || ''}</div>
                        </div>
                        ${b.imageUrl ? `<img src="${b.imageUrl}" />` : ''}
                    </div>
                `).join('');
                dotsEl.innerHTML = banners.map((_, i) => `<div class="d ${i === 0 ? 'active' : ''}"></div>`).join('');
                // Only show first banner in preview (carousel)
                const allPreviews = previewEl.querySelectorAll('.preview-banner');
                allPreviews.forEach((el, i) => { el.style.display = i === 0 ? 'flex' : 'none'; });
            }
        }

        // Real-time listener
        const q = query(collection(db, 'app_banners'), orderBy('order', 'asc'));
        onSnapshot(q, (snap) => {
            banners = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            connStatus.textContent = 'Connected';
            connStatus.className = 'status online';
            renderBanners();
        }, (err) => {
            connStatus.textContent = 'Disconnected';
            connStatus.className = 'status offline';
        });
    </script>
</body>
</html>
